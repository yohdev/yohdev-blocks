name: Build

on:
    push:
        branches:
            - main
            - master
    pull_request:

jobs:
    build:
        name: Lint & build blocks
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Package plugin
              run: npm run plugin:zip

            - name: Upload plugin artifact
              uses: actions/upload-artifact@v4
              with:
                  name: yohdev-blocks
                  path: yohdev-blocks.zip
